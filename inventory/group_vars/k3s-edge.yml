# Cluster identity
k3s_cluster_name: k3s-edge

# Control plane VIP (managed by kube-vip)
k3s_vip: 10.0.3.20

# Pin K3s release. Empty channel/version → install script default ("stable" channel).
# Set either k3s_channel ("stable" / "latest" / "v1.31") or k3s_version ("v1.31.5+k3s1").
# Bumping either + running playbooks/k3s-edge-update.yml performs a rolling upgrade.
k3s_channel: "stable"
k3s_version: ""
# k3s_version: "v1.34.4+k3s1"

# K3s server flags. --cluster-init is only honored on the first server bootstrap.
k3s_server_exec: "server --cluster-init"

# K3s bundled components to opt out of at install time.
#
# Traefik: K3s installs Traefik by default and its svclb DaemonSet binds
# hostPort 443 on every node. Ingress on this cluster is owned by Envoy
# Gateway (managed from homelab-gitops via Argo CD); when Envoy's data plane
# Service tries to claim 443 through the same klipper-lb mechanism, the
# Traefik svclb wins because it's already there, and Envoy's svclb pods
# stay Pending forever. Disabling Traefik at install time eliminates the
# conflict on a from-scratch build and means there is one fewer ingress
# controller running for nothing. See homelab-gitops/docs/setup-log.md
# (Week 10 course-correction) for the full story.
#
# Do NOT add `servicelb` here — that is klipper-lb, which IS the mechanism
# Envoy's LoadBalancer Service uses to get an EXTERNAL-IP without
# hostNetwork on this CNI.
k3s_disable:
  - traefik

# Embedded-etcd snapshot management (server-side, in-tree).
k3s_etcd_snapshot_cron: "0 */6 * * *"
k3s_etcd_snapshot_retention: 10
k3s_etcd_snapshot_dir: /var/lib/rancher/k3s/server/db/snapshots

# Network interface for kube-vip ARP
kubevip_iface: eth0

# kube-vip container version
kubevip_version: v1.0.4

# K3s install script location
k3s_install_script: /tmp/k3s-install.sh

# K3s filesystem paths
k3s_config_dir: /etc/rancher/k3s
k3s_manifests_dir: /var/lib/rancher/k3s/server/manifests

# Local destination for fetched kubeconfig.
k3s_kubeconfig_local: "{{ playbook_dir }}/../kubeconfig-{{ k3s_cluster_name }}.yaml"
