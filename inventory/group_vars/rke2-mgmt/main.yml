# Cluster identity
rke2_cluster_name: rke2-mgmt

# Extra nameservers after cloud-init's 10.0.3.2 (playbooks/dns-failover.yml).
# 10.0.3.20 is the edge cluster's kube-vip VIP; the backup Pi-hole
# (homelab-gitops apps/pihole-edge) answers 53 on every edge node address.
dns_failover_servers:
  - 10.0.3.20

# Control plane VIP (managed by kube-vip). Reachable on :6443 (kube API)
# and :9345 (RKE2 supervisor / join port).
rke2_vip: 10.0.3.40

# Pin RKE2 release. Empty channel/version → install script default ("stable" channel).
# Set either rke2_channel ("stable" / "latest" / "v1.31") or rke2_version
# ("v1.31.5+rke2r1"). Bumping either + running playbooks/rke2-mgmt-update.yml
# performs a rolling upgrade.
rke2_channel: "stable"
# Pinned 2026-10-18 at the version actually running. An empty value meant "whatever
# the stable channel served on install day", so a rebuild was not reproducible.
rke2_version: "v1.36.5+rke2r1"

# Seconds the control plane + every etcd member must stay continuously healthy after
# a node returns from reboot/upgrade, before the serial play uncordons it and moves on
# (roles/rke2/tasks/control-plane-settled.yml). Added after the 2026-10-18 quorum loss.
rke2_settle_seconds: 90

# Embedded-etcd snapshot management (server-side, in-tree).
# Packaged components RKE2 must not deploy. Adding an entry here and running
# playbooks/rke2-mgmt-reconfigure.yml both stops deployment AND deletes the
# already-deployed component (RKE2 server-config semantics), so this is how a
# bundled component is removed from a live cluster.
#
# rke2-ingress-nginx was removed in plan v2 W2 (2026-09-17) to free hostPorts
# 80/443 for the gitops-managed Traefik DaemonSet (ADR-0010; homelab-gitops
# docs/runbooks/mgmt-httproute-migration.md). `rke2_ingress_controller: none`
# below now covers it too; the entry stays so the intent is explicit.
rke2_disable:
  - rke2-ingress-nginx

# Which bundled ingress controller RKE2 deploys. `none` disables every bundled
# ingress chart and its CRD chart (rke2-ingress-nginx, rke2-traefik, and their
# -crd charts). mgmt's ingress is the gitops-managed Traefik.
#
# Required from RKE2 v1.36: when this is unset, 1.36 picks the default by looking
# for an ingress-nginx HelmChart. mgmt has none (disabled above), so it would
# deploy rke2-traefik and rke2-traefik-crd: a second controller fighting ours
# for hostPorts 80/443 (Rancher + Argo CD), plus Gateway API CRDs that Argo
# already owns (rke2 pkg/bootstrap/bootstrap.go, updateManifests). Must be in
# config.yaml BEFORE the 1.36 upgrade: rke2-mgmt-update.yml doesn't rewrite
# config.yaml, so apply it with rke2-mgmt-reconfigure.yml first.
rke2_ingress_controller: none

rke2_etcd_snapshot_cron: "0 */6 * * *"
rke2_etcd_snapshot_retention: 10
rke2_etcd_snapshot_dir: /var/lib/rancher/rke2/server/db/snapshots

# Network interface for kube-vip ARP. The Proxmox VMs in this fleet expose the
# primary NIC as `eth0` (cloud-init/predictable-names disabled). Override per-host
# if a node uses a different NIC name.
kubevip_iface: eth0

# kube-vip container version
kubevip_version: v1.0.4

# RKE2 install script location
rke2_install_script: /tmp/rke2-install.sh

# RKE2 filesystem paths
rke2_config_dir: /etc/rancher/rke2
rke2_data_dir: /var/lib/rancher/rke2
rke2_manifests_dir: /var/lib/rancher/rke2/server/manifests
rke2_bin_dir: /var/lib/rancher/rke2/bin
rke2_kubeconfig_remote: /etc/rancher/rke2/rke2.yaml

# Local destination for fetched kubeconfig.
rke2_kubeconfig_local: "{{ playbook_dir }}/../kubeconfig-{{ rke2_cluster_name }}.yaml"

# ---------------------------------------------------------------------------
# One-time Helm bootstrap (cert-manager → Rancher → Argo CD)
# ---------------------------------------------------------------------------
# These vars feed the rke2-mgmt-{certmanager,rancher,argocd,bootstrap} plays.
# Everything here is one-shot: after Argo CD is up and syncing homelab-gitops,
# upgrades and config changes for these components happen through Git, not
# through this repo. Re-running the playbooks is still safe (helm install
# upgrades in place) and is the intended path for the Phase 2 teardown drill.
#
# Chart versions are intentionally pinned. Bump deliberately; verify against
# the upstream release notes (RKE2 / Kubernetes version compatibility for
# Rancher in particular). Leaving these as floating "latest" turns the
# rebuild drill into a moving target.
#
# Secret values (currently just rancher_bootstrap_password) live in the
# gitignored sibling file `secrets.yml`. Copy `secrets.yml.example` to
# `secrets.yml` and fill it in before running the bootstrap.

# Helm executes from the workstation against the fetched admin kubeconfig.
# The bootstrap plays use connection: local and read this path directly.
bootstrap_kubeconfig: "{{ rke2_kubeconfig_local }}"

# cert-manager — prerequisite for any real TLS issuance. Bootstrap installs
# the chart with CRDs; ClusterIssuers come later via gitops once the
# Cloudflare token + internal DNS are in place.
certmanager_namespace: cert-manager
certmanager_release_name: cert-manager
certmanager_chart_repo_name: jetstack
certmanager_chart_repo_url: https://charts.jetstack.io
certmanager_chart_ref: jetstack/cert-manager
certmanager_chart_version: v1.21.3

# Rancher — served on the mgmt wildcard with a Let's Encrypt PROD cert
# (ADR-0009 W1 Phase 4, 2026-09-09). ingress.tls.source=secret consumes the
# cert-manager-issued `tls-rancher-ingress` secret; the Certificate itself lives in
# homelab-gitops `apps/mgmt-tls/cert-rancher.yaml` and merges only INSIDE the Phase 4
# window, after this play's helm upgrade removes the chart's own self-signed
# Certificate/Issuer and orphans that secret name. Ordering matters — see
# homelab-gitops/docs/runbooks/mgmt-tls-migration.md.
rancher_namespace: cattle-system
rancher_release_name: rancher
rancher_chart_repo_name: rancher-stable
rancher_chart_repo_url: https://releases.rancher.com/server-charts/stable
rancher_chart_ref: rancher-stable/rancher
rancher_chart_version: "2.15.3"
# Hostname the Rancher UI answers on. Must resolve (publicly or via your
# internal DNS) to the RKE2 ingress entrypoint — typically the kube-vip VIP
# or whatever LoadBalancer/Ingress IP the mgmt cluster exposes.
# Split-horizon (ADR-0009): resolves ONLY via Pi-hole -> 10.0.3.41/42/43; there is
# deliberately no public A record. Downstream cluster nodes must resolve this name
# or their cattle-cluster-agents cannot reconnect after the cutover.
rancher_hostname: rancher.mgmt.wretchedhive.io
# How Rancher is exposed. These three defaults match the chart defaults and the
# currently-deployed release, so they are a no-op today.
#
# plan v2 W2 (mgmt HTTPRoute migration) flips them inside the cutover window:
#   rancher_network_exposure: none        (chart emits no Ingress and no Gateway)
#   rancher_tls_mode: external            (Traefik terminates TLS; Rancher serves HTTP)
# `rancher_ingress_tls_source` then becomes irrelevant but is harmless.
#
# Verified against chart 2.14.2 by rendering all three modes:
#   type=ingress -> Ingress/rancher            (today)
#   type=gateway -> Gateway/rancher-gateway + HTTPRoute/rancher  (chart's OWN gateway —
#                   NOT what W2 wants; we attach to the shared `yavin` Gateway instead)
#   type=none    -> no exposure resources at all  (what W2 uses)
# CUTOVER VALUES (plan v2 W2, set 2026-09-12):
#   none     -> chart emits no Ingress and no Gateway; exposure is the HTTPRoute
#               in homelab-gitops apps/mgmt-control-plane/httproute-rancher.yaml
#   external -> Traefik terminates TLS at the `yavin` Gateway using the
#               *.mgmt.wretchedhive.io wildcard; Rancher serves plain HTTP
#
# Run playbooks/rke2-mgmt-rancher.yml with these ONLY AFTER Traefik is serving
# and the Gateway reports PROGRAMMED=True (step 4). Running earlier removes
# Rancher's Ingress with nothing to replace it — the UI and every downstream
# cattle-cluster-agent lose their endpoint.
rancher_network_exposure: none
rancher_tls_mode: external
rancher_ingress_tls_source: secret

# Replicas. RKE2 has 3 servers; the upstream default of 3 is right.
rancher_replicas: 3

# Argo CD — minimal bootstrap. The plan calls for Argo to take over its own
# config (app-of-apps from homelab-gitops) right after install, so this play
# stays deliberately bare: namespace + chart, ClusterIP service, no ingress.
# Access via `kubectl port-forward` until the gitops repo wires the real
# ingress + RBAC.
argocd_namespace: argocd
argocd_release_name: argocd
argocd_chart_repo_name: argo
argocd_chart_repo_url: https://argoproj.github.io/argo-helm
argocd_chart_ref: argo/argo-cd
argocd_chart_version: "10.11.6"
