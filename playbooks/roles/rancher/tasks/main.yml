---
# One-shot Rancher install for the rke2-mgmt cluster bootstrap.
# Caller drives this from localhost against the fetched admin kubeconfig
# (see playbooks/rke2-mgmt-rancher.yml). The cert-manager role must have
# run first — Rancher's pre-install hook checks for the cert-manager
# webhook and refuses to start without it.
#
# TLS: ingress.tls.source=secret (ADR-0009 W1 Phase 4, 2026-09-09). The chart
# HARDCODES the ingress secret name `tls-rancher-ingress` for source=secret. That
# secret is owned by the chart's own self-signed Certificate until THIS upgrade
# removes the Certificate/Issuer and orphans it; only then may the LE Certificate in
# homelab-gitops `apps/mgmt-tls/cert-rancher.yaml` be merged to overwrite it.
# Run this play FIRST, then merge that cert. Do not invert the order.
#
# agentTLSMode: system-store makes downstream cattle-cluster-agents verify the
# Rancher endpoint against the public trust chain instead of the CATTLE_CA_CHECKSUM
# pin — the trust-model fragility behind the 2026-07-10 agent-disconnect incident.
#
# NOTE: `additionalTrustedCAs: true` is present on the LIVE release (added by a manual
# helm upgrade, revision 4/5 Jun 2026) but has never been set by this role. Helm
# replaces user-supplied values wholesale, so running this play drops it — which is
# the intended ADR-0003 cleanup. Nothing to delete here; do not re-add it.
#
# Helm 4 + rancher chart hook workaround
# ---------------------------------------
# Same regression that bites the argo-cd chart (see roles/argocd/tasks/main.yml):
# Helm 4 hangs on `helm.sh/hook-delete-policy: before-hook-creation` waiting to
# delete a hook resource that never existed, leaving the release stuck in
# `pending-upgrade` with no manifests applied. The Rancher chart's pre-upgrade
# Job (`helm-operation-*`) hits the same bug on `helm upgrade`. Until upstream
# Helm fixes it, we disable hooks. The Rancher chart's pre-upgrade Job is
# idempotent setup work (bootstrap-secret owner-ref reconciliation) that is
# safe to skip on second-and-later revisions — the resources already exist
# from the initial install. When Helm fixes the regression, drop disable_hook.

- name: Ensure rancher-stable helm repo is configured
  kubernetes.core.helm_repository:
    name: "{{ rancher_chart_repo_name }}"
    repo_url: "{{ rancher_chart_repo_url }}"

- name: Install Rancher
  kubernetes.core.helm:
    name: "{{ rancher_release_name }}"
    chart_ref: "{{ rancher_chart_ref }}"
    chart_version: "{{ rancher_chart_version }}"
    release_namespace: "{{ rancher_namespace }}"
    create_namespace: true
    disable_hook: true
    kubeconfig: "{{ bootstrap_kubeconfig }}"
    wait: true
    wait_timeout: 15m0s
    values:
      hostname: "{{ rancher_hostname }}"
      replicas: "{{ rancher_replicas }}"
      bootstrapPassword: "{{ rancher_bootstrap_password }}"
      agentTLSMode: system-store
      ingress:
        tls:
          source: secret
  no_log: true
