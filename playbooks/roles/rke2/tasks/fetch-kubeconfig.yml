---
- name: Slurp kubeconfig from primary server
  ansible.builtin.slurp:
    src: "{{ rke2_kubeconfig_remote }}"
  register: rke2_kubeconfig_raw
  become: true

# RKE2 hardcodes the cluster/context/user names to `default` in the kubeconfig
# it generates (same as K3s). We rewrite all six occurrences (cluster name,
# context name, user name, context's cluster ref, context's user ref,
# current-context) to `rke2_cluster_name` so the file is self-describing and
# won't collide if merged with other kubeconfigs. Cert data is base64 and
# never contains `: default`, so the literal-string replace is safe.
- name: Write kubeconfig locally with VIP and cluster name rewritten in
  ansible.builtin.copy:
    dest: "{{ rke2_kubeconfig_local }}"
    mode: "0600"
    content: >-
      {{ rke2_kubeconfig_raw.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' ~ rke2_vip ~ ':6443')
         | replace(': default', ': ' ~ rke2_cluster_name) }}
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
