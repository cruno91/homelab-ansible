---
- name: Slurp kubeconfig from primary server
  ansible.builtin.slurp:
    src: "{{ rke2_kubeconfig_remote }}"
  register: rke2_kubeconfig_raw
  become: true

- name: Write kubeconfig locally with VIP rewritten in
  ansible.builtin.copy:
    dest: "{{ rke2_kubeconfig_local }}"
    mode: "0600"
    content: "{{ rke2_kubeconfig_raw.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ rke2_vip ~ ':6443') }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
