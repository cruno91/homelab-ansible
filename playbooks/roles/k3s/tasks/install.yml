---
- name: Ensure curl is installed
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
  become: true

- name: Ensure K3s config dir exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    mode: "0755"
  become: true

- name: Write K3s config.yaml
  ansible.builtin.copy:
    dest: "{{ k3s_config_dir }}/config.yaml"
    mode: "0644"
    content: |
      write-kubeconfig-mode: "644"
      tls-san:
        - "{{ k3s_vip }}"
      etcd-snapshot-schedule-cron: "{{ k3s_etcd_snapshot_cron }}"
      etcd-snapshot-retention: {{ k3s_etcd_snapshot_retention }}
      etcd-snapshot-dir: "{{ k3s_etcd_snapshot_dir }}"
  become: true

# kube-vip auto-applies from the K3s server-manifests dir on the bootstrap node.
# K3s reconciles the cluster-wide DaemonSet from there; we only stage on one node.
- name: Stage kube-vip manifests on bootstrap node
  ansible.builtin.include_role:
    name: kubevip
  vars:
    kubevip_manifests_dir: "{{ k3s_manifests_dir }}"
    kubevip_vip_address: "{{ k3s_vip }}"
  when: inventory_hostname == groups['k3s-dev'][0]

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: "{{ k3s_install_script }}"
    mode: "0755"
  when: not k3s_binary.stat.exists

# First server: bootstrap cluster
- name: Install K3s on first server
  ansible.builtin.command: "{{ k3s_install_script }}"
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_CHANNEL: "{{ k3s_channel | default('') }}"
    INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"
    INSTALL_K3S_EXEC: "{{ k3s_server_exec }}"
  become: true
  when: inventory_hostname == groups['k3s-dev'][0]

- name: Wait for K3s API server to be ready
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ ansible_facts['default_ipv4']['address'] }}"
    timeout: 120
  when:
    - inventory_hostname == groups['k3s-dev'][0]
    - not ansible_check_mode

- name: Read K3s cluster token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_raw
  become: true
  when:
    - inventory_hostname == groups['k3s-dev'][0]
    - not ansible_check_mode

- name: Set cluster token fact
  ansible.builtin.set_fact:
    k3s_cluster_token: "{{ k3s_token_raw.content | b64decode | trim }}"
  when:
    - inventory_hostname == groups['k3s-dev'][0]
    - not ansible_check_mode

# Additional servers: join cluster
- name: Join K3s cluster
  ansible.builtin.command: "{{ k3s_install_script }}"
  args:
    creates: /usr/local/bin/k3s
  environment:
    K3S_URL: "https://{{ hostvars[groups['k3s-dev'][0]].ansible_host }}:6443"
    K3S_TOKEN: "{{ hostvars[groups['k3s-dev'][0]].k3s_cluster_token | default('') }}"
    INSTALL_K3S_CHANNEL: "{{ k3s_channel | default('') }}"
    INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"
    INSTALL_K3S_EXEC: "{{ k3s_server_exec }}"
  become: true
  when:
    - inventory_hostname != groups['k3s-dev'][0]
    - not ansible_check_mode
