---
# One-at-a-time reboot for a K3s dev node. Caller play must use serial: 1.
# Drains via a helper node, reboots, waits for the local k3s API and node
# Ready, then uncordons — same shape as update.yml so etcd quorum (2-of-3)
# is preserved.
#
# Inputs:
#   k3s_reboot_force (bool, default false)
#     true  → always reboot the node
#     false → only reboot if /var/run/reboot-required exists on the node
- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: k3s_reboot_required

- name: Skip safe reboot for this host (no reboot needed)
  ansible.builtin.meta: end_host
  when:
    - not (k3s_reboot_force | default(false) | bool)
    - not k3s_reboot_required.stat.exists

- name: Determine helper node for drain/uncordon
  ansible.builtin.set_fact:
    k3s_helper_node: "{{ (groups['k3s-dev'] | reject('equalto', inventory_hostname) | list)[0] | default('') }}"

- name: Fail if no helper node is available
  ansible.builtin.fail:
    msg: "Safe reboot requires at least 2 nodes in the [k3s-dev] group."
  when: k3s_helper_node == ''

- name: Drain node before reboot — {{ ansible_hostname }}
  ansible.builtin.command: >-
    k3s kubectl drain {{ ansible_hostname }}
      --ignore-daemonsets
      --delete-emptydir-data
      --force
      --timeout=300s
  delegate_to: "{{ k3s_helper_node }}"
  become: true
  changed_when: true

- name: Reboot {{ ansible_hostname }}
  ansible.builtin.reboot:
    msg: "Reboot triggered by Ansible (k3s safe-reboot)"
    reboot_timeout: 600
    pre_reboot_delay: 10
    post_reboot_delay: 30
    test_command: whoami
  become: true

- name: Wait for local K3s API to be ready again
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ ansible_facts['default_ipv4']['address'] }}"
    timeout: 300

- name: Wait for node to report Ready
  ansible.builtin.command: >-
    k3s kubectl wait
      --for=condition=Ready
      node/{{ ansible_hostname }}
      --timeout=300s
  delegate_to: "{{ k3s_helper_node }}"
  become: true
  changed_when: false

- name: Uncordon {{ ansible_hostname }}
  ansible.builtin.command: k3s kubectl uncordon {{ ansible_hostname }}
  delegate_to: "{{ k3s_helper_node }}"
  become: true
  changed_when: true
