---
- name: Slurp kubeconfig from primary server
  ansible.builtin.slurp:
    src: "{{ k3s_config_dir }}/k3s.yaml"
  register: k3s_kubeconfig_raw
  become: true

# K3s hardcodes the cluster/context/user names to `default` in the kubeconfig it
# generates. We rewrite all six occurrences (cluster name, context name, user
# name, context's cluster ref, context's user ref, current-context) to
# `k3s_cluster_name` so the file is self-describing and won't collide if merged
# with other kubeconfigs. Cert data is base64 and never contains `: default`,
# so the literal-string replace is safe.
- name: Write kubeconfig locally with VIP and cluster name rewritten in
  ansible.builtin.copy:
    dest: "{{ k3s_kubeconfig_local }}"
    mode: "0600"
    content: >-
      {{ k3s_kubeconfig_raw.content | b64decode
         | replace('https://127.0.0.1:6443', 'https://' ~ k3s_vip ~ ':6443')
         | replace(': default', ': ' ~ k3s_cluster_name) }}
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false
