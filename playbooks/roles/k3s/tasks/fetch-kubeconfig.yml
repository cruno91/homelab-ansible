---
- name: Slurp kubeconfig from primary server
  ansible.builtin.slurp:
    src: "{{ k3s_config_dir }}/k3s.yaml"
  register: k3s_kubeconfig_raw
  become: true

- name: Write kubeconfig locally with VIP rewritten in
  ansible.builtin.copy:
    dest: "{{ k3s_kubeconfig_local }}"
    mode: "0600"
    content: "{{ k3s_kubeconfig_raw.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ k3s_vip ~ ':6443') }}"
  delegate_to: localhost
  become: false
