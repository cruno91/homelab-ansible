---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [never, os_upgrade]

- name: Upgrade packages
  ansible.builtin.apt:
    upgrade: dist
  become: true
  tags: [never, os_upgrade]

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required
  tags: [never, os_upgrade]

- name: Ensure common packages installed
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - git
      - vim
      - htop
      - unzip
    state: present
  become: true

- name: Ensure timezone is set
  community.general.timezone:
    name: "America/New_York"
  become: true

- name: Ensure SSH is enabled and running
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
  become: true

# K3s-dev and RKE2-mgmt nodes are rebooted by their safe-reboot plays
# (drain → reboot → wait Ready → uncordon) so etcd quorum is preserved.
# Proxmox hosts are never auto-rebooted — they run VMs and the reboot
# decision belongs to a human. Skip the simple reboot path here for all
# three.
- name: Reboot system if required
  ansible.builtin.reboot:
    msg: "Reboot triggered by Ansible after OS upgrade"
    reboot_timeout: 600
    pre_reboot_delay: 10
    post_reboot_delay: 30
    test_command: whoami
  when:
    - reboot_required.stat.exists
    - "'k3s-edge' not in group_names"
    - "'rke2-mgmt' not in group_names"
    - "'proxmox' not in group_names"
  become: true
  tags: [never, os_upgrade]

- name: Reboot system manually
  ansible.builtin.reboot:
    msg: "Manually reboot when asked to"
    reboot_timeout: 600
    pre_reboot_delay: 10
    post_reboot_delay: 30
    test_command: whoami
  when:
    - "'k3s-edge' not in group_names"
    - "'rke2-mgmt' not in group_names"
    - "'proxmox' not in group_names"
  become: true
  tags: [never, manual_reboot]
