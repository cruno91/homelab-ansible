---
# Remove a single non-bootstrap node from the K3s cluster.
# Usage: --extra-vars "target_node=<inventory hostname in [k3s-dev]>"
- name: Validate node removal request
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ensure target_node is set and safe to remove
      ansible.builtin.assert:
        that:
          - target_node is defined
          - target_node in groups['k3s-dev']
          - target_node != groups['k3s-dev'][0]
        fail_msg: |
          Pass --extra-vars "target_node=<hostname>" naming a non-bootstrap
          node in the [k3s-dev] group. The bootstrap node ({{ groups['k3s-dev'][0] }})
          cannot be removed via this playbook because the install playbook
          treats it as the cluster's source of truth. To replace the bootstrap
          node, restore from an etcd snapshot instead.

- name: Drain and delete target node from cluster
  hosts: "{{ groups['k3s-dev'] | reject('equalto', target_node) | list | first }}"
  gather_facts: false
  tasks:
    - name: Drain {{ target_node }}
      ansible.builtin.command: >-
        k3s kubectl drain {{ target_node }}
          --ignore-daemonsets
          --delete-emptydir-data
          --force
          --timeout=300s
      become: true
      changed_when: true

    - name: Delete node object from cluster
      ansible.builtin.command: k3s kubectl delete node {{ target_node }}
      become: true
      changed_when: true

- name: Uninstall K3s from {{ target_node }}
  hosts: "{{ target_node }}"
  gather_facts: false
  vars:
    k3s_action: uninstall
    k3s_skip_primary: false
  roles:
    - k3s
