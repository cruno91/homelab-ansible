---
- name: Baseline management for non-K3s RPis
  hosts: rpis:!k3s-edge
  gather_facts: true
  roles:
    - base

# Proxmox runs VMs; we never want it to reboot itself out from under them.
# The base role's reboot tasks self-skip for hosts in the proxmox group,
# so os_upgrade here just patches packages and leaves the reboot decision
# to a human.
- name: Baseline management for Proxmox hosts
  hosts: proxmox
  gather_facts: true
  roles:
    - base

# Triggered only by --tags proxmox_post_install. One-shot setup that
# disables pve-enterprise, adds pve-no-subscription, kills the nag, and
# reboots. Gated by /var/lib/proxmox-post-install.done so re-running is
# harmless.
- name: Proxmox first-run post-install (opt-in)
  hosts: proxmox
  gather_facts: true
  roles:
    - proxmox
  tags: [never, proxmox_post_install]

# K3s nodes apply baseline one at a time so the cluster is never broadly
# disturbed. The base role's reboot tasks self-skip for k3s-edge hosts; the
# safe-reboot plays below own the reboot, drain, and re-Ready dance.
- name: Baseline management for K3s dev cluster
  hosts: k3s-edge
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - base

# Triggered only by --tags os_upgrade. Each node reboots only if
# /var/run/reboot-required exists; the safe-reboot task file checks that
# and end_hosts itself when there is no work to do.
- name: Safe rolling reboot for K3s dev cluster (if required after OS upgrade)
  hosts: k3s-edge
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    k3s_action: safe_reboot
    k3s_reboot_force: false
  roles:
    - k3s
  tags: [never, os_upgrade]

# Triggered only by --tags manual_reboot. Always reboots, drained one at
# a time so etcd quorum (2-of-3) is preserved.
- name: Safe rolling manual reboot for K3s dev cluster
  hosts: k3s-edge
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    k3s_action: safe_reboot
    k3s_reboot_force: true
  roles:
    - k3s
  tags: [never, manual_reboot]

# RKE2 mgmt nodes apply baseline one at a time so the cluster is never
