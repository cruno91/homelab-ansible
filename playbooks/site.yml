  gather_facts: true
  serial: 1
  any_errors_fatal: true
  roles:
    - base

# Triggered only by --tags os_upgrade. Each node reboots only if
# /var/run/reboot-required exists; the safe-reboot task file checks that
# and end_hosts itself when there is no work to do.
- name: Safe rolling reboot for RKE2 mgmt cluster (if required after OS upgrade)
  hosts: rke2-mgmt
  gather_facts: true
  serial: 1
  any_errors_fatal: true
  vars:
    rke2_action: safe_reboot
    rke2_reboot_force: false
  roles:
    - rke2
  tags: [never, os_upgrade]

# Triggered only by --tags manual_reboot. Always reboots, drained one at
# a time so etcd quorum (2-of-3) is preserved.
- name: Safe rolling manual reboot for RKE2 mgmt cluster
