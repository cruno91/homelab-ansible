---
# Bootstrap-only: installs Rancher via Helm on the rke2-mgmt cluster.
# Requires cert-manager to be present already (rke2-mgmt-certmanager.yml).
# Day 0 only. Since 2026-11-01 Argo CD owns Rancher (homelab-gitops
# clusters/mgmt/rancher.yaml); upgrades and value changes go there. Re-running
# this on a live cluster fights Argo for the release. Keep
# rancher_chart_version equal to that file's targetRevision (CI checks it).
- name: Install Rancher on rke2-mgmt
  hosts: localhost
  connection: local
  gather_facts: false
  # See playbooks/rke2-mgmt-certmanager.yml for the rationale — bootstrap
  # plays run on the workstation and don't need sudo, even though
  # group_vars/all.yml turns become on for the rest of the fleet.
  # group_vars/all.yml sets ansible_become: true, which beats a bare
  # `become: false` keyword for the implicit localhost — so we also set
  # the variable form here to make the override stick.
  become: false
  vars:
    ansible_become: false
  vars_files:
    - ../inventory/group_vars/rke2-mgmt/main.yml
    - ../inventory/group_vars/rke2-mgmt/secrets.yml
  roles:
    - rancher
