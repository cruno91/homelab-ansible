---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (yamllint + ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-lint-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-lint-

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # The rke2-mgmt bootstrap playbooks vars_files in
      # inventory/group_vars/rke2-mgmt/secrets.yml, which is gitignored
      # (real values live there locally; CI never holds them). Materialize
      # placeholders so ansible-lint can load the playbooks.
      - name: Stage placeholder secrets for lint
        run: |
          for example in inventory/group_vars/*/secrets.yml.example; do
            target="${example%.example}"
            [ -f "$target" ] || cp "$example" "$target"
          done

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  syntax:
    name: Ansible syntax + inventory parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-syntax-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-syntax-

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Verify inventory parses
        run: ansible-inventory -i inventory/hosts.ini --list >/dev/null

      # See the matching lint-job step for why this exists.
      - name: Stage placeholder secrets for syntax-check
        run: |
          for example in inventory/group_vars/*/secrets.yml.example; do
            target="${example%.example}"
            [ -f "$target" ] || cp "$example" "$target"
          done

      - name: Syntax-check every playbook
        run: |
          set -euo pipefail
          for f in playbooks/*.yml; do
            echo "::group::syntax-check ${f}"
            ansible-playbook --syntax-check -i inventory/hosts.ini "$f" \
              --extra-vars "target_node=k3s-edge-node-3"
            echo "::endgroup::"
          done
