---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly, so chart-pin drift against homelab-gitops surfaces even in weeks
  # when nobody opens a PR against this repo. See the version-sync job.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  lint:
    name: Lint (yamllint + ansible-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-lint-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-lint-

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # The rke2-mgmt bootstrap playbooks vars_files in
      # inventory/group_vars/rke2-mgmt/secrets.yml, which is gitignored
      # (real values live there locally; CI never holds them). Materialize
      # placeholders so ansible-lint can load the playbooks.
      - name: Stage placeholder secrets for lint
        run: |
          for example in inventory/group_vars/*/secrets.yml.example; do
            target="${example%.example}"
            [ -f "$target" ] || cp "$example" "$target"
          done

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint

  syntax:
    name: Ansible syntax + inventory parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-syntax-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: pip-${{ runner.os }}-syntax-

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Verify inventory parses
        run: ansible-inventory -i inventory/hosts.ini --list >/dev/null

      # See the matching lint-job step for why this exists.
      - name: Stage placeholder secrets for syntax-check
        run: |
          for example in inventory/group_vars/*/secrets.yml.example; do
            target="${example%.example}"
            [ -f "$target" ] || cp "$example" "$target"
          done

      - name: Syntax-check every playbook
        run: |
          set -euo pipefail
          for f in playbooks/*.yml; do
            echo "::group::syntax-check ${f}"
            ansible-playbook --syntax-check -i inventory/hosts.ini "$f" \
              --extra-vars "target_node=k3s-edge-node-3"
            echo "::endgroup::"
          done

  version-sync:
    name: Bootstrap chart pins match homelab-gitops
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      # These charts are installed once by Ansible on day 0 and owned by Argo CD
      # from day 1 (ADR-0004), so the version is pinned in BOTH repos. If they
      # drift, a from-scratch rebuild installs one version and Argo immediately
      # converts it to the other -- a silent flap during the very drill that is
      # supposed to prove the rebuild works. homelab-gitops is the source of
      # truth; this job fails if the pins here disagree with it.
      #
      # Read-only and unauthenticated: both repos are public, so no token is
      # needed and nothing here can write to the other repo.
      - name: Compare cert-manager + argo-cd pins against homelab-gitops
        run: python .github/scripts/check-chart-pins.py
